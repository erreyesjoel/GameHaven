{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | GameHaven</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="password-reset-body">
    <div class="password-reset-container">
        <h1>Restablecer contraseña</h1>
        <p>Introduce el correo de tu cuenta de administrador y te enviaremos un enlace.</p>

        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="login-error">
                    {% for error in form.email.errors %}{{ error }}{% endfor %}
                </div>
            {% endif %}
            <div class="form-group">
                <label for="id_email">Correo electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    {{ form.email }}
                </div>
            </div>
            <button type="submit" class="btn-submit">Enviar enlace <i class="fas fa-arrow-right"></i></button>
        </form>
        <a href="{% url 'login_template' %}" class="btn-secondary">Volver al login</a>
    </div>
</body>
</html>
