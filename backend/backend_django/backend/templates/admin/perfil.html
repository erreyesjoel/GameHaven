{% include 'components/header/header.html' %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">
<div class="main-content">
  <div class="container-formulario">
    <form class="juego-formulario" method="POST">
      {% csrf_token %}
      <div class="juego-formulario-header">
        <h1>Perfil del administrador</h1>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">Nombre:</label>
          <input type="text" id="first_name" name="first_name" value="{{ usuario.first_name }}" required>
        </div>
        <div class="form-group">
          <label for="last_name">Apellidos:</label>
          <input type="text" id="last_name" name="last_name" value="{{ usuario.last_name }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full-width">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full-width">
          <label for="rol">Rol:</label>
          <input type="text" id="rol" value="{{ usuario.get_rol_display }}" readonly>
        </div>
      </div>
      <button type="submit" class="btn-enviar-formulario">Guardar cambios</button>
    </form>
  </div>
</div>
